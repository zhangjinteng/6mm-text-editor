<!DOCTYPE html>

<head><meta charset="UTF-8"><title>三个独立订阅的弹幕区</title></head>
<body>
<h2>弹幕区 A · 简洁列表</h2>
<div data-danmaku-id="chat-a" data-danmaku-source="current" data-danmaku-skin="simple" data-danmaku-limit="30"><p>连接直播间后自动显示消息。</p></div>

<h2>弹幕区 C · blivechat 结构</h2>
<div data-danmaku-id="chat-c" data-danmaku-source="current" data-danmaku-skin="blivechat" data-danmaku-limit="50"><p>连接直播间后自动显示消息。</p></div>
